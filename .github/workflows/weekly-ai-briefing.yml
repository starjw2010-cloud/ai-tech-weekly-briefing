name: Weekly IT & AI News Briefing (Wednesday 10:00 KST)

on:
  schedule:
    # 매주 수요일 오전 10:00 KST (한국시간 수요일 10시 = UTC 수요일 01:00) 자동 실행
    - cron: '0 1 * * 3'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  weekly-ai-briefing:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Collect Weekly IT & AI 4 Deep-Dive Domains & 8 Quick Radar News (7-day window)
        run: |
          python3 scripts/collect_weekly_ai_news.py

      - name: Archive Weekly Raw Cache, Markdown Report & Slack Post to briefing-archive Branch
        run: |
          KST_DATE=$(TZ=Asia/Seoul date +%Y-%m-%d)
          git config user.name "ai-tech-briefing-bot"
          git config user.email "actions@github.com"
          git checkout -B briefing-archive
          git add raw_cache/ briefings/
          git diff --staged --quiet || git commit -m "chore(briefing): ${KST_DATE} 주간 IT·AI 브리핑 자동 아카이빙"
          git push origin briefing-archive --force

      - name: Publish or Update Weekly IT & AI Briefing Issue (Triggers Email Notification)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          KST_DATE=$(TZ=Asia/Seoul date +"%Y.%m.%d")
          TITLE="🤖 [주간 IT·AI 브리핑] ${KST_DATE} 4대 핵심 이슈 & 주요 단신 8선"
          EXISTING_NUM=$(gh issue list --repo "${{ github.repository }}" --state open --search "${KST_DATE} in:title" --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING_NUM" ]; then
            gh issue edit "$EXISTING_NUM" --repo "${{ github.repository }}" --title "$TITLE" --body-file /tmp/latest_ai_issue_body.md
            echo "Updated existing issue #${EXISTING_NUM}"
          else
            gh issue create \
              --repo "${{ github.repository }}" \
              --title "$TITLE" \
              --body-file /tmp/latest_ai_issue_body.md \
              --assignee "starjw2010-cloud"
          fi
